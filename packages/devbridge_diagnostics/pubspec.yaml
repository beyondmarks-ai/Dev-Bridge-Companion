name: devbridge_diagnostics
description: Opt-in Flutter diagnostics SDK for DevBridge test sessions.
version: 0.3.0
publish_to: "none"

environment:
  sdk: ^3.12.2
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ai.beyondmarks.devbridge.diagnostics
        pluginClass: DevBridgeDiagnosticsPlugin
